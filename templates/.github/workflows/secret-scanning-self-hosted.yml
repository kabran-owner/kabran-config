# Secret Scanning Workflow (Self-Hosted Runners)
#
# Scans code for exposed secrets using Gitleaks.
# Runs on PRs and pushes to prevent secret leaks.
#
# Runner Labels: [self-hosted, linux, x64, docker]
#
# For GitHub-hosted runners, use secret-scanning.yml instead.
#
# Note: This complements GitHub's native Secret Scanning feature.
# Enable native Secret Scanning in repository settings for additional protection.

name: Secret Scanning

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only required for GitHub Organizations
          # Personal accounts are free, even for commercial use
