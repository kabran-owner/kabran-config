# Kabran CI Workflow (Self-Hosted Runners)
#
# This workflow runs CI on self-hosted runners with Docker support.
# Use this when you have Kosmos CI runners configured.
#
# Runner Labels: [self-hosted, linux, x64, docker]
#
# For GitHub-hosted runners, use ci.yml instead.

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: true
