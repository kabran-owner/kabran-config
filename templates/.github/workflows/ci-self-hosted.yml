# Kabran CI Workflow (Self-Hosted Runners)
#
# This workflow runs CI on self-hosted runners with Docker support.
# Optimized for Turborepo monorepos with pnpm.
#
# Runner Labels: [self-hosted, linux, x64, docker]
#
# For GitHub-hosted runners, use ci.yml instead.

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline
        run: pnpm run ci
        env:
          CI: true
